services:

  - type: web

    name: touch-grass

    runtime: python

    region: singapore

    plan: free

    buildCommand:
      pip install -r backend/requirements.txt

    startCommand:
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: PYTHON_VERSION
        value: 3.13

      - key: GEMMA_URL
        sync: false

      - key: GEMMA_MODEL
        value: gemma3
